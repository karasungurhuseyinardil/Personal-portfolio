<!DOCTYPE html>
<html lang="en" dir="ltr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex, follow">
    <title>404 — Hüseyin Ardıl Karasungur</title>
    <link rel="icon" type="image/svg+xml"
        href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='20' fill='%238b5cf6'/><text x='50%25' y='50%25' font-family='monospace' font-size='38' font-weight='bold' fill='white' dominant-baseline='central' text-anchor='middle'>HAK</text></svg>" />

    <!-- Bu sayfa /her/hangi/derin/yol adresinde de sunulabildiği için
         hiçbir dış dosyaya bağlı değil: stiller inline, ikonlar SVG. -->
    <style>
        :root {
            --clr-bg: #080d1a;
            --clr-card: #111827;
            --clr-border: rgba(255, 255, 255, .07);
            --clr-primary: #8b5cf6;
            --clr-primary-lt: #a78bfa;
            --clr-accent: #06b6d4;
            --clr-txt: #f1f5f9;
            --clr-txt-2: #94a3b8;
            --grad-main: linear-gradient(135deg, #8b5cf6 0%, #6366f1 50%, #06b6d4 100%);
        }

        [data-theme="light"] {
            --clr-bg: #f8faff;
            --clr-card: #ffffff;
            --clr-border: rgba(15, 23, 42, .1);
            --clr-txt: #0f172a;
            --clr-txt-2: #475569;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100dvh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 1.5rem;
            background: var(--clr-bg);
            color: var(--clr-txt);
            font-family: 'Inter', system-ui, -apple-system, sans-serif;
            text-align: center;
            overflow-x: hidden;
        }

        body::before {
            content: '';
            position: fixed;
            inset: 0;
            background: radial-gradient(ellipse 60% 50% at 50% 0%, rgba(139, 92, 246, .18) 0%, transparent 70%);
            pointer-events: none;
        }

        .wrap {
            position: relative;
            max-width: 34rem;
            width: 100%;
        }

        .phone {
            width: 76px;
            height: 76px;
            margin: 0 auto 1.75rem;
            border-radius: 20px;
            display: grid;
            place-items: center;
            background: rgba(139, 92, 246, .12);
            border: 1px solid rgba(139, 92, 246, .3);
            animation: ring 2.6s ease-in-out infinite;
        }

        .phone svg {
            width: 34px;
            height: 34px;
            stroke: var(--clr-primary-lt);
            fill: none;
            stroke-width: 1.9;
            stroke-linecap: round;
            stroke-linejoin: round;
        }

        @keyframes ring {

            0%,
            60%,
            100% {
                transform: rotate(0);
            }

            65%,
            75%,
            85% {
                transform: rotate(-11deg);
            }

            70%,
            80%,
            90% {
                transform: rotate(11deg);
            }
        }

        .code {
            font-family: 'Fira Code', ui-monospace, monospace;
            font-size: clamp(4rem, 18vw, 7rem);
            font-weight: 800;
            line-height: 1;
            letter-spacing: -.03em;
            background: var(--grad-main);
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .msg {
            margin-top: 1.25rem;
            font-size: clamp(1.05rem, 4vw, 1.3rem);
            font-weight: 600;
            line-height: 1.5;
            text-wrap: balance;
        }

        .sub {
            margin-top: .85rem;
            font-size: clamp(.9rem, 3.4vw, 1rem);
            line-height: 1.6;
            color: var(--clr-txt-2);
            text-wrap: balance;
        }

        .path {
            display: inline-block;
            margin-top: 1.5rem;
            max-width: 100%;
            padding: .45rem .85rem;
            border-radius: 8px;
            background: var(--clr-card);
            border: 1px solid var(--clr-border);
            font-family: 'Fira Code', ui-monospace, monospace;
            font-size: .8rem;
            color: var(--clr-txt-2);
            overflow-wrap: anywhere;
        }

        .actions {
            margin-top: 2.25rem;
            display: flex;
            gap: .75rem;
            justify-content: center;
            flex-wrap: wrap;
        }

        .btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: .5rem;
            min-height: 46px;
            padding: .75rem 1.5rem;
            border-radius: 10px;
            border: 1px solid transparent;
            font-size: .95rem;
            font-weight: 600;
            text-decoration: none;
            cursor: pointer;
            transition: transform .25s cubic-bezier(.4, 0, .2, 1), box-shadow .25s, background .25s;
        }

        .btn-main {
            background: var(--grad-main);
            color: #fff;
        }

        .btn-main:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 30px rgba(139, 92, 246, .35);
        }

        .btn-ghost {
            background: transparent;
            border-color: var(--clr-border);
            color: var(--clr-txt-2);
        }

        .btn-ghost:hover {
            border-color: var(--clr-primary);
            color: var(--clr-primary-lt);
        }

        @media (max-width:420px) {
            .actions {
                flex-direction: column;
            }

            .btn {
                width: 100%;
            }
        }

        @media (prefers-reduced-motion: reduce) {
            .phone {
                animation: none;
            }

            .btn {
                transition: none;
            }
        }
    </style>
</head>

<body>
    <main class="wrap">
        <div class="phone" aria-hidden="true">
            <svg viewBox="0 0 24 24">
                <path d="M22 16.9v3a2 2 0 0 1-2.2 2 19.8 19.8 0 0 1-8.6-3.1 19.5 19.5 0 0 1-6-6A19.8 19.8 0 0 1 2.1 4.2 2 2 0 0 1 4.1 2h3a2 2 0 0 1 2 1.7c.1 1 .4 1.9.7 2.8a2 2 0 0 1-.5 2.1L8.1 9.9a16 16 0 0 0 6 6l1.3-1.3a2 2 0 0 1 2.1-.4c.9.3 1.8.6 2.8.7a2 2 0 0 1 1.7 2z" />
                <line x1="2" y1="2" x2="22" y2="22" />
            </svg>
        </div>

        <div class="code">404</div>
        <p class="msg" id="msg">The person you have called is having another call at the moment.</p>
        <p class="sub" id="sub">Please try again later — or head back to the homepage.</p>

        <div class="path" id="path" hidden></div>

        <div class="actions">
            <a class="btn btn-main" href="/" id="btnHome">Back to homepage</a>
            <a class="btn btn-ghost" href="/#contact" id="btnContact">Contact</a>
        </div>
    </main>

    <script>
        (function () {
            /* Dil: önce sitede seçilen dil (main.js 'pf-lang'), yoksa tarayıcı dili */
            var lang;
            try { lang = localStorage.getItem('pf-lang'); } catch (e) { }
            if (lang !== 'tr' && lang !== 'en') {
                lang = (navigator.language || 'en').toLowerCase().indexOf('tr') === 0 ? 'tr' : 'en';
            }

            var t = {
                en: {
                    title: '404 — Hüseyin Ardıl Karasungur',
                    msg: 'The person you have called is having another call at the moment.',
                    sub: 'This page does not exist. Please try again later — or head back to the homepage.',
                    home: 'Back to homepage',
                    contact: 'Contact'
                },
                tr: {
                    title: '404 — Hüseyin Ardıl Karasungur',
                    msg: 'Aradığınız kişi şu anda başka bir çağrıda.',
                    sub: 'Böyle bir sayfa yok. Lütfen daha sonra tekrar deneyiniz — ya da ana sayfaya dönün.',
                    home: 'Ana sayfaya dön',
                    contact: 'İletişim'
                }
            }[lang];

            document.documentElement.lang = lang;
            document.title = t.title;
            document.getElementById('msg').textContent = t.msg;
            document.getElementById('sub').textContent = t.sub;
            document.getElementById('btnHome').textContent = t.home;
            document.getElementById('btnContact').textContent = t.contact;

            /* Tema: sitedeki tercihi uygula (main.js 'pf-theme') */
            try {
                var theme = localStorage.getItem('pf-theme');
                if (theme === 'light') document.documentElement.setAttribute('data-theme', 'light');
            } catch (e) { }

            /* Hangi adresin bulunamadığını göster */
            var p = location.pathname + location.search;
            if (p && p !== '/') {
                var el = document.getElementById('path');
                el.textContent = p;
                el.hidden = false;
            }
        })();
    </script>
</body>

</html>
